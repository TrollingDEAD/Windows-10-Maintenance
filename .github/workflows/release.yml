name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify build, docs and tag
        shell: pwsh
        run: |
          ./tools/Build-Script.ps1 -Check
          ./tools/New-FindingDocs.ps1 -Check
          $version = [regex]::Match((Get-Content ./Windows10_SystemMaintenance.ps1 -Raw), "\`$script:Version = '([^']+)'").Groups[1].Value
          if ("v$version" -ne $env:GITHUB_REF_NAME) { throw "Tag $env:GITHUB_REF_NAME does not match script version $version" }
          if (-not (Select-String -Path ./CHANGELOG.md -Pattern "^## \[$([regex]::Escape($version))\]" -Quiet)) { throw "CHANGELOG.md has no entry for $version" }

      - name: Test
        shell: pwsh
        run: |
          Install-Module Pester -MinimumVersion 5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          Invoke-Pester ./tests -CI

      - name: Checksums
        shell: pwsh
        run: |
          $files = 'Windows10_SystemMaintenance.ps1', 'Invoke-FleetMaintenance.ps1'
          $files | ForEach-Object { '{0}  {1}' -f (Get-FileHash $_ -Algorithm SHA256).Hash.ToLower(), $_ } | Set-Content -Encoding ascii SHA256SUMS.txt
          Get-Content SHA256SUMS.txt

      - name: Release notes from CHANGELOG
        shell: pwsh
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          $log = Get-Content ./CHANGELOG.md -Raw
          $m = [regex]::Match($log, "(?s)## \[$([regex]::Escape($v))\][^\n]*\n(.*?)(?=\n## \[|\z)")
          Set-Content -Path release-notes.md -Value $m.Groups[1].Value.Trim() -Encoding utf8

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:GITHUB_REF_NAME Windows10_SystemMaintenance.ps1 Invoke-FleetMaintenance.ps1 SHA256SUMS.txt --title $env:GITHUB_REF_NAME --notes-file release-notes.md
